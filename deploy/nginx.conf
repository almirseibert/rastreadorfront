# Contrato de proxy do Argos Track: /argos vai para o argos-api, todo o resto para o
# Traccar. É o mesmo roteamento que precisa existir no EasyPanel — veja argos-api/README.md.

server {
    listen 80;
    server_name _;

    # O upload de foto é de até 8 MB; com o overhead do multipart, o limite precisa de
    # folga. Sem isso o proxy devolve 413 antes de a requisição chegar ao argos-api.
    client_max_body_size 12m;

    location /argos/ {
        proxy_pass http://argos-api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming do upload: não acumula o arquivo inteiro em disco no proxy.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://traccar:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O Traccar envia posições em tempo real por WebSocket (/api/socket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
